# Boots every game level in headless Chromium and fails on any JavaScript error.
name: Smoke test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium-headless-shell
      - run: python tools/check_static.py && python tools/smoke.py --wait 700
